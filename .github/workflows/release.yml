name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

          # Check if the current branch is FE
      - name: Check for correct branch
        if: github.ref != 'refs/heads/FE'
        run: |
          echo "This action can only be run on the 'FE' branch."
          exit 1

      # Frontend: Set up Node.js and install dependencies from aerostat_webapp
      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install dependencies for the root package
      - name: Install dependencies for Root
        run: npm install

      - name: Install dependencies for Frontend
        run: |
          cd aerostat_webapp
          npm install

      - name: Build Frontend (Vite)
        run: |
          cd aerostat_webapp
          npm run build

      - name: Compress Frontend Source Code
        run: |
          zip -r frontend-source-code.zip aerostat_webapp/

          # Run semantic-release to generate the new release version
      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Extract the version from semantic-release output
      - name: Get release version
        id: get_release_version
        run: |
          VERSION=$(npx semantic-release --dry-run | grep "The next release version is" | sed 's/^.*is \(.*\)$/\1/')
          echo "::set-output name=VERSION::$VERSION"

      # Create GitHub Release with Semantic Release Version
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_release_version.outputs.VERSION }}
          release_name: Release v${{ steps.get_release_version.outputs.VERSION }}
          assets: frontend-source-code.zip
