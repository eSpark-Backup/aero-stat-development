version: "3.8"

services:
  frontend:
    build: ../aerostat_webapp
    ports:
      - "8081:8081"
    depends_on:
      - backend
    environment:
      - BACKEND_SERVER=http://backend:9001

  backend:
    build: ./mongo_ws_example
    ports:
      - "9001:9001"
    volumes:
      - ./logs:/home/logs

  mock-socket:
    build: ./mongo_ws_example/assets/modbus_tcp_server
    ports:
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
      - "5004:5004"
      - "5005:5006"
      - "5007:5007"
      - "4196:4196"
    profiles:
      - dev


  mongodb:
    build: ./mongo_ws_example/assets/mongodb-docker
    container_name: alfa-compose-mongo-container
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    profiles:
      - dev

volumes:
  mongodb_data:

    
    ##                    DEPLOYEMENT
    ##====================================================
    ##                    
    ## COMMAND:
    ##
    ## docker-compose up -d --build
    ##
    ##
    ##====================================================



    ##                    DEVELOPMENT
    ##====================================================
    ##
    ## COMMAND:
    ##
    ## docker-compose --profile dev up -d
    ##
    ##====================================================

    ## COMMAND TO SHUTDOWN THE SERVICES
    ## docker-compose down
